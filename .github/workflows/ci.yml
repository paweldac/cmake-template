name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: e456309491fd875487bf02b8a0dca76c1b1b00cc

jobs:
  checks:
    name: Scripts and formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format-14 shellcheck
          python3 -m pip install --user cmake-format==0.6.10 pyyaml==6.0.3
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Check shell scripts
        run: shellcheck --color=always scripts/*

      - name: Check C++ formatting
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          ln -s "$(command -v clang-format-14)" "${RUNNER_TEMP}/bin/clang-format"
          PATH="${RUNNER_TEMP}/bin:${PATH}" scripts/format_code -c src tests

      - name: Check CMake formatting
        run: scripts/format_cmake -c .

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 11 / Debug
            id: linux-gcc11-debug
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            apt-packages: gcc-11 g++-11
            cache-key: linux-gcc11
            preset: debug
          - name: GCC 11 / Release
            id: linux-gcc11-release
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            apt-packages: gcc-11 g++-11
            cache-key: linux-gcc11
            preset: release
          - name: Clang 14 / Release
            id: linux-clang14-release
            os: ubuntu-22.04
            cc: clang-14
            cxx: clang++-14
            apt-packages: clang-14
            cache-key: linux-clang14
            preset: release
          - name: AppleClang / Release
            id: macos-appleclang-release
            os: macos-14
            cc: clang
            cxx: clang++
            cache-key: macos-appleclang
            preset: release
          - name: MSVC / Release
            id: windows-msvc-release
            os: windows-2022
            cc: cl
            cxx: cl
            cache-key: windows-msvc
            preset: release
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      PROJECT_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
          persist-credentials: false

      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build ${{ matrix.apt-packages }}

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-binary-cache
            .vcpkg-downloads
          key: vcpkg-${{ matrix.cache-key }}-${{ hashFiles('vcpkg.json') }}

      - name: Prepare vcpkg cache directories
        run: >-
          cmake -E make_directory
          "${{ github.workspace }}/.vcpkg-binary-cache"
          "${{ github.workspace }}/.vcpkg-downloads"

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: '"${PROJECT_VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& (Join-Path $env:PROJECT_VCPKG_ROOT "bootstrap-vcpkg.bat") -disableMetrics'

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Test
        run: >-
          ctest --preset "${{ matrix.preset }}"
          --output-junit "build/${{ matrix.preset }}/test-results.xml"

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.id }}
          path: |
            build/${{ matrix.preset }}/test-results.xml
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # MemorySanitizer needs an instrumented C++ standard library, which is
        # not provided by GitHub-hosted runners.
        sanitizer:
          - Valgrind
          - AddressSanitizer
          - ThreadSanitizer
          - LeakSanitizer
          - UndefinedBehaviorSanitizer
    env:
      CC: gcc-11
      CXX: g++-11
      SANITIZER: ${{ matrix.sanitizer }}
      PROJECT_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
          persist-credentials: false

      - name: Install tools
        run: |
          packages=(gcc-11 g++-11 ninja-build)
          if [[ "${SANITIZER}" == "Valgrind" ]]; then
            packages+=(valgrind)
          fi

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-binary-cache
            .vcpkg-downloads
          key: vcpkg-linux-gcc11-${{ hashFiles('vcpkg.json') }}

      - name: Prepare vcpkg cache directories
        run: >-
          cmake -E make_directory
          "${{ github.workspace }}/.vcpkg-binary-cache"
          "${{ github.workspace }}/.vcpkg-downloads"

      - name: Bootstrap vcpkg
        run: '"${PROJECT_VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Configure
        run: cmake --preset sanitizer -DMEMORY_SANITIZER="${SANITIZER}"

      - name: Build
        run: cmake --build --preset sanitizer

      - name: Test with sanitizers
        run: |
          if [[ "${SANITIZER}" == "Valgrind" ]]; then
            if ! ctest --test-dir build/sanitizer -T memcheck --schedule-random \
              --output-on-failure --no-tests=error --parallel 2; then
              find build/sanitizer/Testing/Temporary -name 'MemoryChecker.*.log' -exec cat {} +
              exit 1
            fi
          else
            case "${SANITIZER}" in
              AddressSanitizer) export ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 ;;
              ThreadSanitizer) export TSAN_OPTIONS=halt_on_error=1 ;;
              LeakSanitizer) export LSAN_OPTIONS=exitcode=1 ;;
              UndefinedBehaviorSanitizer) export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ;;
            esac

            ctest --preset sanitizer --output-junit build/sanitizer/test-results.xml
          fi

      - name: Upload sanitizer results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results-${{ matrix.sanitizer }}
          path: |
            build/sanitizer/test-results.xml
            build/sanitizer/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - checks
      - build
      - sanitizers
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
        run: |
          test "${CHECKS_RESULT}" = success
          test "${BUILD_RESULT}" = success
          test "${SANITIZERS_RESULT}" = success
