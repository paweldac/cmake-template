dist: trusty 
sudo: false
language: cpp
os: linux

addons:
  apt:
    sources:
     - ubuntu-toolchain-r-test
     - llvm-toolchain-trusty-4.0
     - llvm-toolchain-trusty-5.0

compiler:
  - clang-4.0
  - clang-5.0
  - gcc-6
  - gcc-7

env:
  - BOOST_VERSION=1.66.0 BUILD_TESTS=TRUE STATIC_ANALYSIS=TRUE BUILD_TYPE=Debug
  - BOOST_VERSION=1.66.0 CHECK_FORMATTING=TRUE
  - BOOST_VERSION=1.66.0 BUILD_TESTS=FALSE BUILD_TYPE=Release

cache:
  directories:
    - ${TRAVIS_BUILD_DIR}/llvm/llvm-4.0.1
    - ${TRAVIS_BUILD_DIR}/llvm/llvm-5.0.1
    - ${TRAVIS_BUILD_DIR}/boost/boost-1.66.0
    - ${TRAVIS_BUILD_DIR}/cmake/cmake-3.10.3
    - ${TRAVIS_BUILD_DIR}/cppcheck

