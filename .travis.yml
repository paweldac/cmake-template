git:
  submodules: false

before_install:
  - git submodule update --init --recursive

install:
  # Set env variables
  - CMAKE_MAJOR_VERSION=3.10
  - CMAKE_MINOR_VERSION=3
#  - if [[ -n "${LLVM_VERSION}" ]]; then export TOOLSET=clang; fi
#  - if [[ -n "${GCC_VERSION}" ]]; then export TOOLSET=gcc CXX=g++-${GCC_VERSION}; fi
  # Install CMake
  - CMAKE_ROOT=${TRAVIS_BUILD_DIR}/cmake/${CMAKE_MAJOR_VERSION}.${CMAKE_MINOR_VERSION}
  - |
    if [[ -z "$(ls -A ${CMAKE_ROOT}/bin)" ]]; then
      CMAKE_URL="https://cmake.org/files/v${CMAKE_MAJOR_VERSION}/cmake-${CMAKE_MAJOR_VERSION}.${CMAKE_MINOR_VERSION}-Linux-x86_64.tar.gz"
      mkdir -p ${CMAKE_ROOT} && travis_retry wget --no-check-certificate --quiet -O - "${CMAKE_URL}" | tar --strip-components=1 -xz -C cmake/${CMAKE_MAJOR_VERSION}.${CMAKE_MINOR_VERSION}
      export PATH=${CMAKE_ROOT}/bin:${PATH}
    fi
  - cmake --version
  # Install the right version of libc++ and libc++abi
  - echo ${CXX}
  - |
    if [[ "${CXX%%+*}" == "clang" ]]; then
      if   [[ "${CXX}" == "clang++-4.0" ]]; then LLVM_VERSION="4.0.1";
      elif [[ "${CXX}" == "clang++-5.0" ]]; then LLVM_VERSION="5.0.1";
      fi

      LLVM_ROOT="${TRAVIS_BUILD_DIR}/llvm/llvm-${LLVM_VERSION}"
      LLVM_URL="http://llvm.org/releases/${LLVM_VERSION}/llvm-${LLVM_VERSION}.src.tar.xz"
      LIBCXX_URL="http://llvm.org/releases/${LLVM_VERSION}/libcxx-${LLVM_VERSION}.src.tar.xz"
      LIBCXXABI_URL="http://llvm.org/releases/${LLVM_VERSION}/libcxxabi-${LLVM_VERSION}.src.tar.xz"

      mkdir -p ${LLVM_ROOT} ${LLVM_ROOT}/build ${LLVM_ROOT}/projects/libcxx ${LLVM_ROOT}/projects/libcxxabi ${LLVM_ROOT}/clang
      travis_retry wget --quiet -O - ${LLVM_URL}      | tar --strip-components=1 -xJ -C ${LLVM_ROOT} || exit 1
      travis_retry wget --quiet -O - ${LIBCXX_URL}    | tar --strip-components=1 -xJ -C ${LLVM_ROOT}/projects/libcxx || exit 1
      travis_retry wget --quiet -O - ${LIBCXXABI_URL} | tar --strip-components=1 -xJ -C ${LLVM_ROOT}/projects/libcxxabi || exit 1

      (cd ${LLVM_ROOT}/build && cmake .. -DCMAKE_INSTALL_PREFIX=${LLVM_ROOT}/install) || exit 1
      (cd ${LLVM_ROOT}/build/projects/libcxx && make install -j2) || exit 1
      (cd ${LLVM_ROOT}/build/projects/libcxxabi && make install -j2) || exit 1

      export CXXFLAGS="-isystem ${LLVM_ROOT}/install/include/c++/v1"
      export LDFLAGS="-L ${LLVM_ROOT}/install/lib -l c++ -l c++abi"
      export LD_LIBRARY_PATH="${LD_LIBRARY_PATH}:${LLVM_ROOT}/install/lib"
    fi
  - ${CXX} --version
  # Install Boost
  - |
    if [[ "${BOOST_VERSION}" != "" ]]; then
      BOOST_DIR=${TRAVIS_BUILD_DIR}/boost/boost-${BOOST_VERSION}
      if [[ -z "$(ls -A ${BOOST_DIR})" ]]; then
        BOOST_URL="http://sourceforge.net/projects/boost/files/boost/${BOOST_VERSION}/boost_${BOOST_VERSION//\./_}.tar.gz"
        mkdir -p ${BOOST_DIR}
        { travis_retry wget --quiet -O - ${BOOST_URL} | tar --strip-components=1 -xz -C ${BOOST_DIR}; } || exit 1
        (cd ${BOOST_DIR}/tools/build && ./bootstrap.sh --with-toolset=${TOOLSET} && ./b2 toolset=${TOOLSET} install --prefix=${TRAVIS_BUILD_DIR}/boost/b2)
        export PATH=${TRAVIS_BUILD_DIR}/boost/b2/bin:${PATH}
        (cd ${BOOST_DIR} && b2 --build-dir=${BOOST_DIR} toolset=${TOOLSET} stage)
      fi
    fi
  #Intall cppcheck
  - |
    if [[ -z "$(ls -A ${TRAVIS_BUILD_DIR}/cppcheck/bin)" ]]; then
      CPPCHECK_URL="https://github.com/danmar/cppcheck/archive/1.78.tar.gz"
      mkdir -p cppcheck && travis_retry wget --no-check-certificate --quiet -O - "${CPPCHECK_URL}" | tar --strip-components=1 -xz -C cppcheck
      (cd cppcheck && make SRCDIR=build CFGDIR=cfg HAVE_RULES=no CXXFLAGS="-O2 -DNDEBUG -Wall -Wno-sign-compare -Wno-unused-function")
      mkdir -p bin
      mv cppcheck bin/
    fi
    export PATH="${TRAVIS_BUILD_DIR}/cppcheck/bin:${PATH}"
  - cppcheck --version

before_script:
  - cd ${TRAVIS_BUILD_DIR}
  - mkdir build
  - cd build
  - cmake -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_C_COMPILER="$CC" -DBUILD_TYPE="$BUILD_TYPE" -DBOOST_ROOT=${BOOST_DIR} ..

script:
  - |
    if [[ "${CHECK_FORMATTING}" == "true" ]]; then
      make format
      cd ..
      git diff-index --quiet HEAD -- || exit 1;
      exit 0
    fi
  - |
    if [[ "${STATIC_ANALYSIS}" == "true" ]]; then
      cppcheck --enable=all --error-exitcode=1 --project=compile_commands.json
    fi
  - |
    if [[ "${BUILD_TESTS}" == "true" ]]; then
      make cmake-template.ut
    fi
  - make cmake-template.app
